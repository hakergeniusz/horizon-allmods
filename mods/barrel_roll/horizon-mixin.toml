[mod]
id = "barrel_roll"
version = "0.1.0"
priority = 100

# The commit it was tested on: the look hook reroutes the mouse turn
# (game.rs), the bob hook rolls the camera pose (game/fov.rs),
# the tick hook steers the rudder (game.rs, game/creative_hotbar.rs,
# motion.rs' fall_flying), so a Horizon change in those needs a re-check.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The mod's brain: pure standard library, no game types, tested on its own —
# the roll model (mouse swipe, banking chase, the ground settle).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "barrel_roll"
source = "runtime.rs"

# The integrated roll's shared snapshot between the tick, look and bob hooks.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "barrel_state"
source = "state.rs"

# Every game tick: the strafe keys are the rudder, the roll banks into the
# yaw rate, everything settles level off the elytra.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The mouse's look while gliding: the sideways turn rolls instead of yawing.
[[injection]]
id = "look"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::look_turn"
helper = "look.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "x", ty = "f64", value = "x" },
  { name = "y", ty = "f64", value = "y" },
]

# The frame's camera pose: the vanilla bob rebuilt from the same public
# helpers, then the roll on top as a Z rotation.
[[injection]]
id = "bob"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::fov::Game<'_>::bob_matrix"
helper = "bob.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "partial", ty = "f32", value = "partial" },
]

# The row in Options > Mods: the single Enabled toggle.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The settings page: the one Enabled row, in the state the file holds.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# A click on the settings page, stored for the next tick's gates to read.
[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
