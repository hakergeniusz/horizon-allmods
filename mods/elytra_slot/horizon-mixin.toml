[mod]
id = "elytra_slot"
version = "0.1.0"
priority = 100

# The commit it was tested on: it draws into the survival inventory, answers
# its clicks through the game's own menu engine and reads the armor the
# flight checks read, so a Horizon change in the game or mod-hook sources
# needs a re-check.
[compatibility]
horizon_revision = "2ebf00a0281c592f79191e76fce0e7d522c6f425"

# The mod's brain: pure standard library, no game types, tested on its own.
# The slot geometry, the click plans and the keep-state decisions all live
# here; the helpers below are thin adapters over them.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "elytra_slot"
source = "runtime.rs"

# A click on the survival inventory that lands on the mod's elytra slot: the
# whole equip or unequip runs here as real menu clicks through the game's own
# verified menu engine (predicted, and sent to a server), and the vanilla
# click is skipped. Every press over no engine slot reaches this hook on the
# window and a server alike, so the drawn slot answers like a real one.
[[injection]]
id = "click"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::click_inventory"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "right", ty = "bool", value = "right" },
]

# The slot itself, drawn over the plain survival inventory once a frame,
# after the screen and its tooltips: frame, worn elytra or dimmed ghost,
# hover highlight and tooltip. Read-only.
[[injection]]
id = "draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_render_post"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

# Every tick: the slot's self-healing — the elytra leaving the chest slot by
# outside means (a death, a vanilla click) lets the slot go, and the kept
# chestpiece is worn back through the game's own menu clicks when a menu can
# take them.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The row in Options > Mods: the mod and what it does.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The settings page: the Enabled toggle and the read-only state rows.
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

# A click on the settings page, stored for the next tick's gates to read.
[[injection]]
id = "settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "setting_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
